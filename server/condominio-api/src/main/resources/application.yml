spring:
  application:
    name: condominio-api

  mail:
    host: smtp.gmail.com
    port: 587
    username: smartgateapp01@gmail.com
    # No Railway, ele vai ler a variável MAIL_PASSWORD.
    # Localmente, se não tiver variável, vai dar erro no envio de e-mail (o que é esperado para segurança).
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  datasource:
    # Usa a variável DB_URL do Railway. Se não existir, usa o localhost (para seus testes locais).
    url: ${DB_URL:jdbc:mysql://localhost:3306/condominio}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'none' é o correto para produção com Flyway.
      # O Flyway cria as tabelas, o Hibernate só valida/usa.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Em produção, é bom deixar clean-disabled: true para evitar apagar o banco sem querer
    clean-disabled: true
    baseline-version: 0
    validate-on-migrate: false

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO


